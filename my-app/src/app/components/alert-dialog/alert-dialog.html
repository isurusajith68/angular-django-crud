@if (message) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">

    <div class="w-full max-w-sm mx-4 rounded-lg bg-white shadow-xl">

        <div class="p-5">

            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold">
                    {{ title }}
                </h2>

                <button type="button" (click)="onCancel()" class="text-gray-400 hover:text-gray-700 text-xl">
                    ×
                </button>
            </div>

            <p class="text-gray-600">
                {{ message }}
            </p>

        </div>

        <div class="flex justify-end gap-2 border-t px-5 py-3">
            <button type="button" (click)="onCancel()"
                class="px-4 py-2 rounded bg-gray-100 text-gray-700 hover:bg-gray-200">
                {{ cancelText }}
            </button>
            <button type="button" (click)="onConfirm()"
                class="px-4 py-2 rounded text-white"
                [ngClass]="type === 'error' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'">
                {{ confirmText }}
            </button>
        </div>

    </div>

</div>
}
