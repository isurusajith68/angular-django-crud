<div class="">
    <div class="flex items-center justify-center h-16 bg-gray-300">
        DASHBOARD
    </div>
    <div class="flex flex-col flex-1 p-4 bg-gray-200 min-h-[70vh]">
        @for (link of links; track link.href) {
        <a [routerLink]="link.href" class="block px-4 py-2 text-gray-700 hover:bg-gray-300">
            {{ link.label }}
        </a>
        }
    </div>
    <div class="flex flex-col gap-3 p-4 bg-gray-300">
        @if (currentUser(); as user) {
        <div class="flex items-center gap-3">
            <div
                class="flex items-center justify-center shrink-0 w-9 h-9 text-sm font-semibold text-white bg-blue-600 rounded-full">
                {{ user.username.charAt(0).toUpperCase() }}
            </div>
            <div class="min-w-0">
                <p class="text-sm font-medium text-gray-800 truncate">{{ user.username }}</p>
                @if (user.email) {
                <p class="text-xs text-gray-600 truncate">{{ user.email }}</p>
                }
            </div>
        </div>
        }
        <button class="w-full px-4 py-2 text-white bg-red-600 rounded hover:bg-red-700" (click)="logout()">
            Logout
        </button>
    </div>
</div>
