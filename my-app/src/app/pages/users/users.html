<div class="p-4">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold mb-4">User Management</h1>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-300">
            <thead>
                <tr class="bg-gray-100">
                    <th class="px-4 py-2 border-b">ID</th>
                    <th class="px-4 py-2 border-b">Username</th>
                    <th class="px-4 py-2 border-b">Email</th>
                    <th class="px-4 py-2 border-b">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (user of users; track user.id) {
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 border-b">{{ user.id }}</td>
                    <td class="px-4 py-2 border-b">{{ user.name }}</td>
                    <td class="px-4 py-2 border-b">{{ user.email }}</td>
                    <td class="px-4 py-2 border-b">
                        <button (click)="editUser(user)" class="text-blue-500 hover:underline mr-2">Edit</button>
                        <button (click)="confirmDelete(user)" class="text-red-500 hover:underline">Delete</button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

@if(showAlert) {
<app-alert-dialog [title]="alertDialog.title" [message]="alertDialog.message" (confirm)="deleteUser(pendingDeleteId!)"
    (cancel)="cancelDelete()"></app-alert-dialog>
}
