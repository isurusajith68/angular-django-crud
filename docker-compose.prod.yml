# Production stack: pulls prebuilt images from Docker Hub, builds nothing.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: angular-django-crud

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - use a long random value}
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/angular-django-crud-backend:${IMAGE_TAG:-latest}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required - generate a fresh one}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - static-files:/app/staticfiles
      - media-files:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/items/", timeout=5)
          except urllib.error.HTTPError as exc:
              sys.exit(0 if exc.code < 500 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_USERNAME}/angular-django-crud-web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - static-files:/var/www/static:ro
      - media-files:/var/www/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  static-files:
  media-files:
